<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Code Web</title>

  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- highlight.js 语法高亮 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- diff：增量 patch 计算 -->
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>

  <style>
    /* ── Reset & Variables ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #1a1b26;
      --bg2:         #24283b;
      --bg3:         #1e2030;
      --border:      #414868;
      --text:        #c0caf5;
      --text-dim:    #787c99;
      --accent:      #7aa2f7;
      --danger:      #f7768e;
      --success:     #9ece6a;
      --warn:        #e0af68;
      --font-mono:   'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace;
      --radius:      10px;
      --ui-font-size: 15px;
      --file-font-size: 15px;
    }

    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      font-size: var(--ui-font-size);
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    #header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      min-height: 52px;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }

    /* Tab bar */
    .tab-bar { display: flex; gap: 4px; }
    .tab {
      padding: 5px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* Font size controls */
    .font-ctrls { display: flex; align-items: center; gap: 4px; }
    .font-ctrls .size-label {
      font-size: 0.78rem; color: var(--text-dim);
      min-width: 32px; text-align: center;
      font-family: var(--font-mono);
    }

    .header-spacer { flex: 1; }

    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; transition: background .3s; flex: none;
    }
    #status-dot.ok    { background: var(--success); }
    #status-dot.error { background: var(--danger); }
    #status-text { font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }

    .hbtn {
      padding: 5px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .hbtn:hover { background: #2a2f45; }
    .hbtn.danger { color: var(--danger); border-color: var(--danger); }
    .hbtn.danger:hover { background: #2d0f18; }

    /* ── Views ───────────────────────────────────────────────────────────────── */
    #view-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #view-files {
      flex: 1;
      display: none;
      overflow: hidden;
    }

    /* ── Terminal ────────────────────────────────────────────────────────────── */
    #terminal-wrap {
      flex: 1;
      overflow: hidden;
      background: var(--bg3);
      padding: 6px 8px;
    }
    #terminal-wrap .xterm {
      height: 100%;
    }
    #terminal-wrap .xterm-viewport {
      overflow-y: auto !important;
    }

    /* ── Toolbar ─────────────────────────────────────────────────────────────── */
    #toolbar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px 4px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .tbtn {
      padding: 6px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .12s, border-color .12s;
      min-height: 34px;
      min-width: 44px;
      font-family: var(--font-mono);
      user-select: none;
    }
    .tbtn:hover  { background: #2a2f45; border-color: var(--accent); }
    .tbtn:active { background: #1e2333; transform: scale(.96); }
    .tbtn.red    { color: var(--danger); }
    .tbtn.red:hover { border-color: var(--danger); background: #2d0f18; }
    .tbtn.yellow { color: var(--warn); }

    /* ── Input area ──────────────────────────────────────────────────────────── */
    #input-area {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 12px 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    #input {
      flex: 1;
      min-height: 40px;
      max-height: 160px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      line-height: 1.45;
      transition: border-color .15s;
      overflow-y: auto;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #input::placeholder { color: var(--text-dim); }
    #send-btn {
      flex: none;
      padding: 10px 18px;
      background: var(--accent);
      color: #1a1b26;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
      transition: background .15s, opacity .15s;
      align-self: flex-end;
    }
    #send-btn:hover   { background: #89b4fa; }
    #send-btn:active  { background: #6b9de8; }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── File View ───────────────────────────────────────────────────────────── */
    #file-split {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    #file-tree-panel {
      width: 260px;
      min-width: 0;
      flex: none;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg2);
      overflow: hidden;
    }
    #file-tree-panel .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      padding: 10px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    #file-path-bar {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      padding: 6px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    #file-list::-webkit-scrollbar { width: 4px; }
    #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .file-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      transition: background .12s;
    }
    .file-entry:hover { background: var(--bg3); }
    .file-entry.active { background: #2a3566; border: 1px solid #414868; }
    .file-entry .icon { flex: none; width: 18px; text-align: center; font-size: 0.88rem; }
    .file-entry.dir  .name { color: var(--accent); }
    .file-entry.file .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #file-content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #file-content-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      min-height: 46px;
    }
    #file-content-header .file-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file-content-header .file-type-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    #file-content-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    #file-content-body::-webkit-scrollbar { width: 6px; }
    #file-content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .file-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 12px;
      padding: 40px;
    }
    .file-placeholder .ph-icon { font-size: 3rem; }
    .file-placeholder .ph-text { font-size: 0.95rem; }

    /* Code view */
    .code-view {
      background: var(--bg3);
      margin: 0;
      padding: 20px 24px;
      font-family: var(--font-mono);
      font-size: var(--file-font-size);
      line-height: 1.65;
      white-space: pre;
      overflow-x: auto;
      color: var(--text);
      min-height: 100%;
    }
    .code-view::-webkit-scrollbar { height: 6px; }
    .code-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* highlight.js 背景与主题对齐 */
    .code-view code.hljs { background: transparent; padding: 0; }

    /* Markdown view */
    .md-view {
      font-size: var(--file-font-size);
      color: var(--text);
      line-height: 1.75;
      max-width: 860px;
      padding: 24px 32px;
    }
    .md-view h1 { font-size: 1.8em; color: var(--accent); margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .md-view h2 { font-size: 1.4em; color: var(--accent); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .md-view h3 { font-size: 1.15em; color: #9ab6f0; margin: 20px 0 8px; }
    .md-view h4 { font-size: 1em; color: #9ab6f0; margin: 16px 0 6px; }
    .md-view p  { margin: 10px 0; }
    .md-view ul { padding-left: 22px; margin: 8px 0; list-style: disc; }
    .md-view ol { padding-left: 22px; margin: 8px 0; list-style: decimal; }
    .md-view li { margin: 5px 0; }
    .md-view code {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: #9ece6a;
    }
    .md-view pre {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .md-view pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.9em;
      color: var(--text);
    }
    .md-view blockquote {
      border-left: 3px solid var(--border);
      margin: 12px 0;
      padding: 4px 16px;
      color: var(--text-dim);
    }
    .md-view hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .md-view table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 8px 12px; font-size: 0.92em; }
    .md-view th { background: var(--bg3); color: var(--accent); text-align: left; }
    .md-view tr:nth-child(even) { background: rgba(255,255,255,.03); }
    .md-view strong { color: #e0def4; font-weight: 600; }
    .md-view em { color: #c9cbff; }
    .md-view a { color: var(--accent); text-decoration: none; }
    .md-view a:hover { text-decoration: underline; }

    /* ── Resize handle ───────────────────────────────────────────────────────── */
    #resize-handle {
      width: 6px;
      flex: none;
      cursor: col-resize;
      background: var(--border);
      opacity: 0.35;
      transition: opacity 0.15s, background 0.15s, width 0.15s;
      touch-action: none;
      position: relative;
    }
    #resize-handle:hover,
    #resize-handle.dragging {
      opacity: 1;
      background: var(--accent);
    }
    /* 文件树折叠时：加宽把手，显示展开箭头，便于触屏点击 */
    .tree-collapsed #resize-handle {
      width: 18px;
      background: var(--bg2);
      border-right: 2px solid var(--accent);
      opacity: 0.8;
    }
    .tree-collapsed #resize-handle::after {
      content: '›';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
    }
    .tree-collapsed #resize-handle:hover {
      background: var(--bg3);
      opacity: 1;
    }

    /* ── Responsive ──────────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #file-tree-panel { width: 180px; }
      .md-view { padding: 16px; }
      body { font-size: 16px; }
    }
    @media (max-width: 480px) {
      #header h1 { font-size: 0.95rem; }
      .hbtn { padding: 4px 8px; font-size: 0.78rem; }
    }

    /* ── 多格式文件视图 ──────────────────────────────────────────────────────── */
    .docx-view {
      padding: 24px 32px;
      font-size: var(--file-font-size);
      color: var(--text);
      line-height: 1.7;
      max-width: 860px;
    }
    .docx-view table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .docx-view th, .docx-view td { border: 1px solid var(--border); padding: 6px 10px; }

    .table-view { padding: 0; overflow: auto; height: 100%; }
    .table-view table { border-collapse: collapse; font-size: 0.85rem; font-family: var(--font-mono); min-width: 100%; }
    .table-view th {
      background: var(--bg3); color: var(--accent);
      border: 1px solid var(--border); padding: 6px 10px;
      white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    .table-view td { border: 1px solid var(--border); padding: 5px 10px; color: var(--text); white-space: nowrap; }
    .table-view tr:nth-child(even) td { background: rgba(255,255,255,.03); }

    .unsupported-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--text-dim);
      gap: 12px; padding: 40px; font-size: 0.95rem; text-align: center;
    }

    /* ── 在线编辑器 ──────────────────────────────────────────────────────────── */
    #edit-textarea {
      flex: 1; width: 100%; height: 100%;
      padding: 20px 24px;
      background: var(--bg3); border: none; outline: none;
      color: var(--text); font-family: var(--font-mono);
      font-size: var(--file-font-size); line-height: 1.65;
      resize: none; white-space: pre; overflow-wrap: normal;
      overflow-x: auto; tab-size: 2;
    }

    .save-status { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); flex: none; }
    .save-status.saving { color: var(--warn); }
    .save-status.saved  { color: var(--success); }
    .save-status.error  { color: var(--danger); }

    /* ── Agent 写入警告条 ────────────────────────────────────────────────────── */
    #file-change-banner {
      display: none; align-items: center; gap: 10px;
      padding: 8px 16px;
      background: #3d2f00; border-bottom: 1px solid var(--warn);
      color: var(--warn); font-size: 0.85rem; flex: none;
    }
    #file-change-banner.visible { display: flex; }
    #file-change-banner .banner-btns { display: flex; gap: 6px; margin-left: auto; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>Claude Code</h1>

  <div class="tab-bar">
    <button class="tab active" id="tab-chat">聊天</button>
    <button class="tab" id="tab-files">文件</button>
  </div>

  <div class="font-ctrls">
    <button class="hbtn" id="font-dec" title="缩小字体">A-</button>
    <span class="size-label" id="font-size-label">15px</span>
    <button class="hbtn" id="font-inc" title="放大字体">A+</button>
  </div>

  <button class="hbtn" id="enter-mode-btn" title="切换 Enter 键行为"></button>

  <div class="header-spacer"></div>
  <div id="status-dot"></div>
  <span id="status-text">连接中...</span>
  <button class="hbtn danger" id="logout-btn">退出</button>
</div>

<!-- ── Chat View ─────────────────────────────────────────────────────────────── -->
<div id="view-chat">
  <div id="terminal-wrap"></div>

  <div id="toolbar">
    <button class="tbtn" data-key="up"        title="方向键上">↑</button>
    <button class="tbtn" data-key="down"      title="方向键下">↓</button>
    <button class="tbtn" data-key="enter"     title="回车确认">↵ 确认</button>
    <button class="tbtn" data-key="tab"       title="Tab 补全">Tab</button>
    <button class="tbtn yellow" data-key="escape" title="Esc">Esc</button>
    <button class="tbtn" data-text="/clear"    title="清除上下文">/clear</button>
    <button class="tbtn" data-text="/usage"   title="查看用量">/usage</button>
    <button class="tbtn" data-text="1"        title="发送 1">1</button>
    <button class="tbtn" data-text="2"        title="发送 2">2</button>
    <button class="tbtn" data-text="3"        title="发送 3">3</button>
    <button class="tbtn red" data-key="ctrl_c" title="中断 Ctrl+C">⊘ 中断</button>
    <button class="tbtn red" data-key="ctrl_d" title="退出 Ctrl+D">⏏ 退出</button>
  </div>

  <div id="input-area">
    <textarea id="input" rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
</div>

<!-- ── File View ──────────────────────────────────────────────────────────────── -->
<div id="view-files">
  <div id="file-split">

    <!-- Left: file tree -->
    <div id="file-tree-panel">
      <div class="panel-title">文件浏览<div style="display:flex;gap:4px"><button id="tree-collapse-btn" class="hbtn" title="折叠文件树（双击分隔条也可切换）">◀</button><button id="refresh-files-btn" class="hbtn" title="刷新">⟳</button></div></div>
      <div id="file-path-bar">/</div>
      <div id="file-list"></div>
    </div>

    <!-- Drag handle -->
    <div id="resize-handle"></div>

    <!-- Right: file content -->
    <div id="file-content-panel">
      <div id="file-content-header" style="display:none">
        <!-- 只读模式 header -->
        <div id="header-view-mode" style="display:flex;align-items:center;gap:10px;width:100%">
          <span class="file-title" id="file-open-title"></span>
          <span class="file-type-badge" id="file-type-badge"></span>
          <button class="hbtn" id="edit-btn"        style="display:none" title="编辑文件">编辑</button>
          <button class="hbtn" id="insert-path-btn" style="display:none" title="将路径插入聊天输入框">插入路径</button>
        </div>
        <!-- 编辑模式 header -->
        <div id="header-edit-mode" style="display:none;align-items:center;gap:10px;width:100%">
          <span class="file-title" id="edit-file-title"></span>
          <span class="save-status" id="save-status-label"></span>
          <div style="flex:1"></div>
          <button class="hbtn" id="save-btn">保存</button>
          <button class="hbtn danger" id="cancel-edit-btn">取消</button>
        </div>
      </div>
      <!-- Agent 写入警告条 -->
      <div id="file-change-banner">
        <span id="banner-msg">⚠ Claude 已修改此文件</span>
        <div class="banner-btns">
          <button class="hbtn" id="banner-reload-btn">重新加载</button>
          <button class="hbtn danger" id="banner-force-save-btn">强制覆盖保存</button>
        </div>
      </div>
      <div id="file-content-body"></div>
    </div>

  </div>
</div>

<script>
// ── xterm.js Terminal ─────────────────────────────────────────────────────────

const FONT_SIZES = [12, 13, 14, 15, 16, 17, 18, 20];
let fontIdx = FONT_SIZES.indexOf(parseInt(localStorage.getItem('cc_font_size') || '15'));
if (fontIdx < 0) fontIdx = 3;

const term = new Terminal({
  fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
  fontSize: FONT_SIZES[fontIdx],
  theme: {
    background:      '#1e2030',
    foreground:      '#c0caf5',
    cursor:          '#c0caf5',
    cursorAccent:    '#1e2030',
    selectionBackground: '#414868',

// ── 终端 Ctrl+C / Ctrl+V 处理 ─────────────────────────────────────────────────
// Ctrl+C：有选中文字时复制，无选中时发 SIGINT（中断信号）
// Ctrl+V：将剪贴板内容粘贴到终端输入流
term.attachCustomKeyEventHandler(evt => {
  if (evt.type !== 'keydown') return true;

  if (evt.ctrlKey && evt.key === 'c') {
    if (term.hasSelection()) {
      navigator.clipboard.writeText(term.getSelection()).catch(() => {});
      return false;   // 阻止 xterm 将 Ctrl+C 发给 PTY
    }
    return true;      // 无选中 → 正常发 SIGINT
  }

  if (evt.ctrlKey && evt.key === 'v') {
    navigator.clipboard.readText().then(text => {
      if (text && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'input', data: text }));
      }
    }).catch(() => {});
    return false;
  }

  if (evt.ctrlKey && (evt.key === '1' || evt.key === '2' || evt.key === '3')) {
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'input', data: evt.key }));
      ws.send(JSON.stringify({ type: 'key',  key: 'enter' }));
    }
    return false;
  }

  return true;
});

function sendResize() {
  fitAddon.fit();
  const { cols, rows } = term;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'resize', cols, rows }));
  }

  statusText.textContent = text;

(function boot() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'auth', token }));
    reconnectDelay = 1000;
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'auth_ok') {
      connected = true;
      setStatus('ok', `已连接  ${msg.username}`);
      sendBtn.disabled = false;
      sendResize();
      // 断线重连后恢复文件监听
      if (editState.active && editState.filePath) {
        ws.send(JSON.stringify({ type: 'watch_file', path: editState.filePath }));
      }
    }
    else if (msg.type === 'output') {
      term.write(msg.data);
    }
    else if (msg.type === 'exit') {
      connected = false;
      setStatus('error', `进程已退出（code ${msg.code}）`);
      term.write('\r\n\x1b[33m[Claude 进程已退出，刷新页面重启]\x1b[0m\r\n');
    }
    else if (msg.type === 'error') {
      term.write(`\r\n\x1b[31m[错误：${msg.message}]\x1b[0m\r\n`);
      if (msg.message.includes('令牌')) {
        localStorage.removeItem('cc_token');
        setTimeout(() => location.href = '/', 1500);
      }
    }
    else if (msg.type === 'file_changed') {
      if (editState.active && msg.path === editState.filePath) {
        showBanner('Claude 已修改此文件，建议保存后重新加载');
      }
    }
  };

  ws.onclose = () => {
    connected = false;
    sendBtn.disabled = true;
    setStatus('error', '连接断开，重连中…');
    setTimeout(boot, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };

  ws.onerror = () => ws.close();
})();

const resizeHandle  = document.getElementById('resize-handle');
const fileTreePanel = document.getElementById('file-tree-panel');

let isResizing   = false;
let resizeStartX = 0;
let resizeStartW = 0;
let savedTreeWidth = parseInt(localStorage.getItem('cc_tree_width') || '260');
// 页面加载时恢复上次保存的宽度
setTreeWidth(savedTreeWidth);

function setTreeWidth(w) {
  fileTreePanel.style.width = w + 'px';
  if (w === 0) {
    fileSplit.classList.add('tree-collapsed');
  } else {
    fileSplit.classList.remove('tree-collapsed');
    savedTreeWidth = w;
    localStorage.setItem('cc_tree_width', w);
  }
}

function toggleTree() {
  if (fileSplit.classList.contains('tree-collapsed')) {
    setTreeWidth(savedTreeWidth || 260);
  } else {
    setTreeWidth(0);
  }
}

function startResize(clientX) {
  isResizing   = true;
  resizeStartX = clientX;
  resizeStartW = fileTreePanel.offsetWidth;
  resizeHandle.classList.add('dragging');
  document.body.style.cursor     = 'col-resize';
  document.body.style.userSelect = 'none';
}

function doResize(clientX) {
  if (!isResizing) return;
  const raw  = resizeStartW + clientX - resizeStartX;
  const newW = Math.min(Math.max(0, raw), window.innerWidth * 0.75);
  // snap to 0 when dragged below 20px
  setTreeWidth(newW < 20 ? 0 : newW);
}

function stopResize() {
  if (!isResizing) return;
  isResizing = false;
  resizeHandle.classList.remove('dragging');
  document.body.style.cursor     = '';
  document.body.style.userSelect = '';
}

resizeHandle.addEventListener('mousedown', e => { startResize(e.clientX); e.preventDefault(); });
document.addEventListener('mousemove', e => doResize(e.clientX));
document.addEventListener('mouseup',   stopResize);
resizeHandle.addEventListener('dblclick', toggleTree);

resizeHandle.addEventListener('touchstart', e => {
  startResize(e.touches[0].clientX);
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (isResizing) { doResize(e.touches[0].clientX); e.preventDefault(); }
}, { passive: false });
document.addEventListener('touchend', stopResize);

function enterEditMode(filePath, name, content, mtime) {
  editState.active           = true;

  editState.fileName         = name;
  editState.lastSavedContent = content;
  editState.serverMtime      = mtime;

  fileContentBody.innerHTML = '';
  fileContentBody.appendChild(ta);
  ta.focus();

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'watch_file', path: filePath }));
  }
  editState.autoSaveTimer = setInterval(autoSave, 30000);

  // 进入编辑模式时自动折叠文件树，让 textarea 获得全部宽度
  if (!fileSplit.classList.contains('tree-collapsed')) {
    editState.treeWidthBeforeEdit = fileTreePanel.offsetWidth || savedTreeWidth;
    setTreeWidth(0);
  } else {
    editState.treeWidthBeforeEdit = null;  // 已经是折叠状态，退出时不恢复
  }

function exitEditMode() {
  if (!editState.active) return;
  clearInterval(editState.autoSaveTimer);
  editState.autoSaveTimer = null;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'unwatch_file', path: editState.filePath }));
  }
  const fp = editState.filePath, fn = editState.fileName;
  editState.active   = false;
  editState.filePath = null;
  editState.fileName = null;
  document.getElementById('header-view-mode').style.display = 'flex';
  document.getElementById('header-edit-mode').style.display = 'none';
  hideBanner();

  // 退出编辑模式时恢复文件树宽度
  if (editState.treeWidthBeforeEdit) {
    setTreeWidth(editState.treeWidthBeforeEdit);
  }

  openFile(fp, fn);
}

async function saveFile(forceContent) {
  if (editState.saveInProgress) return;
  editState.saveInProgress = true;
  const ta         = document.getElementById('edit-textarea');
  const newContent = forceContent !== undefined ? forceContent : (ta ? ta.value : editState.lastSavedContent);

  setSaveStatus('saving', '保存中…');
  try {
    let body;
    if (forceContent !== undefined) {
      body = { path: editState.filePath, content: forceContent };
    } else {
      const patch = Diff.createPatch(editState.fileName, editState.lastSavedContent, newContent, '', '');
      if (patch.indexOf('@@') === -1) {
        setSaveStatus('saved', '已保存 ' + fmtTime());
        editState.saveInProgress = false;
        return;
      }
      body = { path: editState.filePath, patch, mtime: editState.serverMtime };
    }
    const res  = await fetch('/api/file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.status === 409 && data.conflict) {
      handleConflict(data.currentContent, data.currentMtime, newContent);
    } else if (res.ok) {
      editState.serverMtime      = data.mtime;
      editState.lastSavedContent = newContent;
      setSaveStatus('saved', '已保存 ' + fmtTime());
    } else {
      setSaveStatus('error', '保存失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    setSaveStatus('error', '保存失败：' + e.message);
  } finally {
    editState.saveInProgress = false;
  }
}

function autoSave() {
  if (!editState.active) return;
  const ta = document.getElementById('edit-textarea');
  if (!ta || ta.value === editState.lastSavedContent) return;
  saveFile();
}

function handleConflict(serverContent, serverMtime, localContent) {
  setSaveStatus('error', '保存冲突');
  showBanner('Claude 已修改此文件，与您的编辑产生冲突');
  document.getElementById('banner-reload-btn').onclick = () => {
    const ta = document.getElementById('edit-textarea');
    if (ta) ta.value = serverContent;
    editState.lastSavedContent = serverContent;
    editState.serverMtime      = serverMtime;
    hideBanner();
    setSaveStatus('', '已重新加载');
  };
  document.getElementById('banner-force-save-btn').onclick = () => {
    hideBanner();
    saveFile(localContent);
  };
}

async function loadFiles(dir) {
  fileListEl.innerHTML = '<div class="file-entry"><div class="icon">…</div><div>加载中</div></div>';
  try {
    const url = dir ? `/api/files?path=${encodeURIComponent(dir)}` : '/api/files';
    const res  = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) {
      fileListEl.innerHTML = `<div class="file-entry" style="color:var(--danger)">${data.error}</div>`;
      return;
    }

    pathBar.textContent = data.path;
    currentDir = data.path;
    fileListEl.innerHTML = '';

    if (data.parent && data.parent !== data.path) {
      fileListEl.appendChild(makeEntry('↩ 上级目录', 'dir', data.parent));
    }
    data.entries.forEach(entry => {
      fileListEl.appendChild(makeEntry(entry.name, entry.type, entry.path));
    });
  } catch {
    fileListEl.innerHTML = '<div class="file-entry" style="color:var(--danger)">加载失败</div>';
  }
}

function makeEntry(name, type, filePath) {
  const div = document.createElement('div');
  div.className = `file-entry ${type}`;
  div.innerHTML = `<div class="icon">${type === 'dir' ? '📁' : getFileIcon(name)}</div>
                   <div class="name">${esc(name)}</div>`;
  div.addEventListener('click', () => {
    if (type === 'dir') {
      loadFiles(filePath);
    } else {
      fileListEl.querySelectorAll('.file-entry').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      openFile(filePath, name);
    }
  });
  return div;
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    md: '📝', txt: '📄', js: '🟨', ts: '🔷', py: '🐍',
    sh: '⚙️', json: '{ }', yaml: '📋', yml: '📋',
    css: '🎨', html: '🌐', htm: '🌐', go: '🐹',
    rs: '🦀', java: '☕', c: '⚙️', cpp: '⚙️', h: '⚙️',
    docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', csv: '📊', pdf: '📕',
  };
  return icons[ext] || '📄';
}

function detectFileType(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['md','markdown','mdx'].includes(ext)) return 'markdown';
  if (ext === 'docx') return 'docx';
  if (ext === 'doc')  return 'doc';
  if (['xlsx','xls','csv'].includes(ext)) return 'xlsx';
  if (ext === 'pdf')  return 'pdf';
  const codeExts = ['js','ts','jsx','tsx','py','sh','bash','json','yaml','yml',
                    'css','html','htm','go','rs','java','c','cpp','h','hpp',
                    'toml','ini','env','sql','xml','dockerfile','gitignore'];
  if (codeExts.includes(ext)) return 'code';
  return 'text';
}

function isEditableType(t) { return ['text','code','markdown'].includes(t); }

const langMap = {
  c:'c', h:'c', cpp:'cpp', cc:'cpp', cxx:'cpp', hpp:'cpp',
  py:'python', pyw:'python',
  js:'javascript', jsx:'javascript', mjs:'javascript',
  ts:'typescript', tsx:'typescript',
  go:'go', rs:'rust', java:'java', kt:'kotlin', swift:'swift',
  sh:'bash', bash:'bash', zsh:'bash',
  json:'json', yaml:'yaml', yml:'yaml', toml:'ini',
  css:'css', scss:'scss', less:'less',
  html:'html', htm:'html', xml:'xml',
  sql:'sql', md:'markdown', lua:'lua', rb:'ruby', php:'php',
};

function renderCodeView(name, content) {
  const ext  = name.split('.').pop().toLowerCase();
  const lang = langMap[ext];
  const pre  = document.createElement('pre');
  pre.className = 'code-view';
  const code = document.createElement('code');
  code.textContent = content;
  if (lang && window.hljs && hljs.getLanguage(lang)) {
    code.className = `language-${lang}`;
    pre.appendChild(code);
    hljs.highlightElement(code);
  } else {
    pre.appendChild(code);
  }
  fileContentBody.innerHTML = '';
  fileContentBody.appendChild(pre);
}

async function openFile(filePath, name) {
  // 若处于编辑模式，先静默退出（不保存）
  if (editState.active) {
    clearInterval(editState.autoSaveTimer);
    editState.autoSaveTimer = null;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'unwatch_file', path: editState.filePath }));
    }
    editState.active   = false;
    editState.filePath = null;
    editState.fileName = null;
    document.getElementById('header-view-mode').style.display = 'flex';
    document.getElementById('header-edit-mode').style.display = 'none';
  }

  // 释放旧 PDF Object URL
  if (currentPdfObjUrl) { URL.revokeObjectURL(currentPdfObjUrl); currentPdfObjUrl = null; }

  document.getElementById('file-content-header').style.display = 'flex';
  document.getElementById('header-view-mode').style.display    = 'flex';
  document.getElementById('header-edit-mode').style.display    = 'none';
  document.getElementById('edit-btn').style.display            = 'none';
  fileOpenTitle.textContent   = filePath;
  insertPathBtn.style.display = 'inline-block';
  currentFilePath = filePath;
  hideBanner();

  fileTypeBadge.textContent = '';
  fileContentBody.innerHTML = '<div class="file-placeholder"><div class="ph-icon">⏳</div><div class="ph-text">加载中…</div></div>';

  try {
    const res  = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (!res.ok) {
      fileContentBody.innerHTML = `<div class="file-placeholder"><div class="ph-icon">❌</div><div class="ph-text">${esc(data.error)}</div></div>`;
      return;
    }

    const serverType = data.type;   // 服务端返回的 type

    if (serverType === 'docx') {
      fileTypeBadge.textContent = 'DOCX';
      fileContentBody.innerHTML = `<div class="docx-view">${data.html}</div>`;

    } else if (serverType === 'xlsx') {
      fileTypeBadge.textContent = name.split('.').pop().toUpperCase();
      fileContentBody.innerHTML = `<div class="table-view">${data.html}</div>`;

    } else if (serverType === 'pdf') {
      fileTypeBadge.textContent = 'PDF';
      const pdfRes = await fetch(data.rawUrl, { headers: { Authorization: 'Bearer ' + token } });
      const blob   = await pdfRes.blob();
      currentPdfObjUrl = URL.createObjectURL(blob);
      fileContentBody.innerHTML = `<embed src="${currentPdfObjUrl}" type="application/pdf" width="100%" style="height:100%;min-height:600px">`;

    } else if (serverType === 'unsupported') {
      fileTypeBadge.textContent = name.split('.').pop().toUpperCase();
      fileContentBody.innerHTML = `<div class="unsupported-view"><div style="font-size:2rem">🚫</div><div>${esc(data.message)}</div></div>`;

    } else {
      // text 类型
      const localType = detectFileType(name);
      fileTypeBadge.textContent = localType === 'markdown' ? 'Markdown' : localType === 'code' ? name.split('.').pop().toUpperCase() : 'TEXT';

      if (localType === 'markdown') {
        fileContentBody.innerHTML = `<div class="md-view">${renderMarkdown(data.content)}</div>`;
      } else {
        renderCodeView(name, data.content);
      }

      // 可编辑文件显示编辑按钮
      const editBtn = document.getElementById('edit-btn');
      editBtn.style.display = 'inline-block';
      editBtn.onclick = () => enterEditMode(filePath, name, data.content, data.mtime);
    }
  } catch (e) {
    fileContentBody.innerHTML = `<div class="file-placeholder"><div class="ph-icon">❌</div><div class="ph-text">读取失败: ${esc(e.message)}</div></div>`;
  }
}

insertPathBtn.addEventListener('click', () => {
  if (!currentFilePath) return;
  switchView('chat');
  inputEl.value += (inputEl.value ? ' ' : '') + currentFilePath;
  autoResize();
  inputEl.focus();
});

// ── Markdown renderer ─────────────────────────────────────────────────────────

function renderMarkdown(raw) {
  const codeBlocks = [];

  let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang || '', code });
    return `\n\x00CODE${idx}\x00\n`;
  });

  text = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const inlineCodes = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    const idx = inlineCodes.length;
    inlineCodes.push(code);
    return `\x01IC${idx}\x01`;
  });

  text = text.replace(/^#### (.+)$/gm,  '<h4>$1</h4>');
  text = text.replace(/^### (.+)$/gm,   '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm,    '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm,     '<h1>$1</h1>');

  text = text.replace(/^---+$/gm, '<hr>');
  text = text.replace(/^\*\*\*+$/gm, '<hr>');

  text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  text = text.replace(/((?:^\|.+\|\n?)+)/gm, tableBlock => {
    const rows = tableBlock.trim().split('\n');
    if (rows.length < 2) return tableBlock;
    const parsedRows = rows.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const isSep = row => row.every(c => /^[-: ]+$/.test(c));
    if (!isSep(parsedRows[1])) return tableBlock;
    const headers = parsedRows[0].map(c => `<th>${c}</th>`).join('');
    const body = parsedRows.slice(2).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table>`;
  });

  text = text.replace(/((?:^[*\-] .+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[*\-] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  text = text.replace(/((?:^\d+\. .+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  text = text.replace(/\x01IC(\d+)\x01/g, (_, idx) => `<code>${inlineCodes[idx]}</code>`);

  text = text.replace(/\x00CODE(\d+)\x00/g, (_, idx) => {
    const { lang, code } = codeBlocks[idx];
    const safeCode = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<pre><code class="lang-${lang}">${safeCode.trim()}</code></pre>`;
  });

  text = text.split(/\n\n+/).map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(h[1-6]|ul|ol|blockquote|pre|table|hr)/.test(block)) return block;
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  return text;
}

// ── Shared escape ──────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────

sendBtn.disabled = true;
setStatus('', '连接中…');
</script>
