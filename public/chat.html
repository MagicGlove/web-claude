<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Code Web</title>

  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- highlight.js 语法高亮 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- diff：增量 patch 计算 -->
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>

  <style>
    /* ── Reset & Variables ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #1a1b26;
      --bg2:         #24283b;
      --bg3:         #1e2030;
      --border:      #414868;
      --text:        #c0caf5;
      --text-dim:    #787c99;
      --accent:      #7aa2f7;
      --danger:      #f7768e;
      --success:     #9ece6a;
      --warn:        #e0af68;
      --font-mono:   'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace;
      --radius:      10px;
      --ui-font-size: 15px;
      --file-font-size: 15px;
    }

    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      font-size: var(--ui-font-size);
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    #header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      min-height: 52px;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 1rem; font-weight: 700; color: var(--accent); white-space: nowrap; }

    /* Tab bar */
    .tab-bar { display: flex; gap: 4px; }
    .tab {
      padding: 5px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* Font size controls */
    .font-ctrls { display: flex; align-items: center; gap: 4px; }
    .font-ctrls .size-label {
      font-size: 0.78rem; color: var(--text-dim);
      min-width: 32px; text-align: center;
      font-family: var(--font-mono);
    }

    .header-spacer { flex: 1; }

    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; transition: background .3s; flex: none;
    }
    #status-dot.ok    { background: var(--success); }
    #status-dot.error { background: var(--danger); }
    #status-text { font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }

    .hbtn {
      padding: 5px 11px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .hbtn:hover  { background: var(--bg2); border-color: var(--accent); }
    .hbtn.danger { border-color: var(--danger); color: var(--danger); }
    .hbtn.danger:hover { background: rgba(247,118,142,.12); }

    /* ── Chat View ──────────────────────────────────────────────────────────── */
    #view-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #view-files {
      flex: 1;
      display: none;
      overflow: hidden;
    }

    #chat-term-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    #terminal-wrap {
      width: 100%;
      height: 100%;
      background: var(--bg3);
    }

    /* 滚动到底部浮动按钮 */
    #scroll-bottom-btn {
      position: absolute;
      bottom: 10px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(36, 40, 59, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      z-index: 50;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.55);
      transition: background .12s, border-color .12s;
      padding: 0;
    }
    #scroll-bottom-btn:hover { background: #2e3354; border-color: var(--accent); }
    #scroll-bottom-btn.visible { display: flex; }

    /* ── Toolbar ─────────────────────────────────────────────────────────────── */
    #toolbar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 10px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .tbtn {
      padding: 5px 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background .12s;
      white-space: nowrap;
    }
    .tbtn:hover  { background: #2e3354; }
    .tbtn.yellow { border-color: var(--warn);    color: var(--warn); }
    .tbtn.red    { border-color: var(--danger);  color: var(--danger); }

    /* ── Input area ─────────────────────────────────────────────────────────── */
    #input-area {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    #input {
      flex: 1;
      min-height: 40px;
      max-height: 160px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 12px;
      resize: none;
      font-family: inherit;
      line-height: 1.45;
      overflow-y: auto;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #input::placeholder { color: var(--text-dim); }
    #send-btn {
      flex: none;
      padding: 10px 18px;
      background: var(--accent);
      color: #1a1b26;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
      transition: background .15s, opacity .15s;
      align-self: flex-end;
    }
    #send-btn:hover   { background: #89b4fa; }
    #send-btn:active  { background: #6b9de8; }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── File View ───────────────────────────────────────────────────────────── */
    #file-split {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #file-tree-panel {
      width: 260px;
      min-width: 0;
      flex: none;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg2);
      overflow: hidden;
    }
    #file-tree-panel .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      padding: 10px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    #file-path-bar {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      padding: 6px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    #file-list::-webkit-scrollbar { width: 4px; }
    #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .file-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      transition: background .12s;
    }
    .file-entry:hover { background: var(--bg3); }
    .file-entry.active { background: #2a3566; border: 1px solid #414868; }
    .file-entry.dragging-over { background: rgba(122,162,247,.15); border: 1px dashed var(--accent); }
    .file-entry .icon { flex: none; width: 18px; text-align: center; font-size: 0.88rem; }
    .file-entry.dir  .name { color: var(--accent); }
    .file-entry.file .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── File content area & panes ───────────────────────────────────────────── */
    #file-content-area {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      min-width: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .pane-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      min-height: 46px;
    }
    .pane-view-hd, .pane-edit-hd {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .pane-header .file-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pane-header .file-type-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .pane-body {
      flex: 1;
      overflow: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .pane-body::-webkit-scrollbar { width: 6px; }
    .pane-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Pane divider (between left and right pane) ──────────────────────────── */
    #pane-divider {
      width: 5px;
      flex: none;
      cursor: col-resize;
      background: var(--border);
      opacity: 0.4;
      transition: opacity .15s, background .15s;
    }
    #pane-divider:hover,
    #pane-divider.dragging { opacity: 1; background: var(--accent); }

    /* ── Drop hint overlay ───────────────────────────────────────────────────── */
    .drop-hint {
      position: absolute;
      pointer-events: none;
      border: 2px dashed var(--accent);
      background: rgba(122, 162, 247, 0.08);
      border-radius: 8px;
      top: 8px; bottom: 8px;
      z-index: 20;
      display: none;
    }
    .drop-hint.left  { display: block; left: 8px;  right: 50%; }
    .drop-hint.right { display: block; left: 50%;  right: 8px; }

    .file-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 12px;
      padding: 40px;
    }
    .file-placeholder .ph-icon { font-size: 3rem; }
    .file-placeholder .ph-text { font-size: 0.95rem; }

    /* Code view */
    .code-view {
      background: var(--bg3);
      margin: 0;
      padding: 20px 24px;
      font-family: var(--font-mono);
      font-size: var(--file-font-size);
      line-height: 1.65;
      white-space: pre;
      overflow-x: auto;
      color: var(--text);
      min-height: 100%;
    }
    .code-view::-webkit-scrollbar { height: 6px; }
    .code-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* highlight.js 背景与主题对齐 */
    .code-view code.hljs { background: transparent; padding: 0; }

    /* Markdown view */
    .md-view {
      font-size: var(--file-font-size);
      color: var(--text);
      line-height: 1.75;
      max-width: 860px;
      padding: 24px 32px;
    }
    .md-view h1 { font-size: 1.8em; color: var(--accent); margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .md-view h2 { font-size: 1.4em; color: var(--accent); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .md-view h3 { font-size: 1.15em; color: #9ab6f0; margin: 20px 0 8px; }
    .md-view h4 { font-size: 1em; color: #9ab6f0; margin: 16px 0 6px; }
    .md-view p  { margin: 10px 0; }
    .md-view ul { padding-left: 22px; margin: 8px 0; list-style: disc; }
    .md-view ol { padding-left: 22px; margin: 8px 0; list-style: decimal; }
    .md-view li { margin: 5px 0; }
    .md-view code {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: #9ece6a;
    }
    .md-view pre {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .md-view pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.9em;
      color: var(--text);
    }
    .md-view blockquote {
      border-left: 3px solid var(--border);
      margin: 12px 0;
      padding: 4px 16px;
      color: var(--text-dim);
    }
    .md-view hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .md-view table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 8px 12px; font-size: 0.92em; }
    .md-view th { background: var(--bg3); color: var(--accent); text-align: left; }
    .md-view tr:nth-child(even) { background: rgba(255,255,255,.03); }
    .md-view strong { color: #e0def4; font-weight: 600; }
    .md-view em { color: #c9cbff; }
    .md-view a { color: var(--accent); text-decoration: none; }
    .md-view a:hover { text-decoration: underline; }

    /* ── Resize handle (tree ↔ content) ─────────────────────────────────────── */
    #resize-handle {
      width: 6px;
      flex: none;
      cursor: col-resize;
      background: var(--border);
      opacity: 0.35;
      transition: opacity 0.15s, background 0.15s, width 0.15s;
      touch-action: none;
      position: relative;
    }
    #resize-handle:hover,
    #resize-handle.dragging {
      opacity: 1;
      background: var(--accent);
    }
    /* 文件树折叠时：加宽把手，显示展开箭头，便于触屏点击 */
    .tree-collapsed #resize-handle {
      width: 18px;
      background: var(--bg2);
      border-right: 2px solid var(--accent);
      opacity: 0.8;
    }
    .tree-collapsed #resize-handle::after {
      content: '›';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
    }
    .tree-collapsed #resize-handle:hover {
      background: var(--bg3);
      opacity: 1;
    }

    /* ── Responsive ──────────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #file-tree-panel { width: 180px; }
      .md-view { padding: 16px; }
      body { font-size: 16px; }
    }
    @media (max-width: 480px) {
      #header h1 { font-size: 0.95rem; }
      .hbtn { padding: 4px 8px; font-size: 0.78rem; }
    }

    /* ── 多格式文件视图 ──────────────────────────────────────────────────────── */
    .docx-view {
      padding: 24px 32px;
      font-size: var(--file-font-size);
      color: var(--text);
      line-height: 1.7;
      max-width: 860px;
    }
    .docx-view table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .docx-view th, .docx-view td { border: 1px solid var(--border); padding: 6px 10px; }

    .table-view { padding: 0; overflow: auto; height: 100%; }
    .table-view table { border-collapse: collapse; font-size: 0.85rem; font-family: var(--font-mono); min-width: 100%; }
    .table-view th {
      background: var(--bg3); color: var(--accent);
      border: 1px solid var(--border); padding: 6px 10px;
      white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    .table-view td { border: 1px solid var(--border); padding: 5px 10px; color: var(--text); white-space: nowrap; }
    .table-view tr:nth-child(even) td { background: rgba(255,255,255,.03); }

    .unsupported-view {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--text-dim);
      gap: 12px; padding: 40px; font-size: 0.95rem; text-align: center;
    }

    /* ── 在线编辑器 ──────────────────────────────────────────────────────────── */
    .edit-textarea {
      flex: 1;
      box-sizing: border-box;
      width: 100%; min-height: 0;
      padding: 20px 24px;
      background: var(--bg3); border: none; outline: none;
      color: var(--text); font-family: var(--font-mono);
      font-size: var(--file-font-size); line-height: 1.65;
      resize: none; white-space: pre; overflow-wrap: normal;
      overflow: auto; tab-size: 2;
    }

    .save-status { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); flex: none; }
    .save-status.saving { color: var(--warn); }
    .save-status.saved  { color: var(--success); }
    .save-status.error  { color: var(--danger); }

    /* ── Agent 写入警告条（per-pane） ────────────────────────────────────────── */
    .pane-banner {
      display: none; align-items: center; gap: 10px;
      padding: 8px 16px;
      background: #3d2f00; border-bottom: 1px solid var(--warn);
      color: var(--warn); font-size: 0.85rem; flex: none;
    }
    .pane-banner.visible { display: flex; }
    .pane-banner .banner-btns { display: flex; gap: 6px; margin-left: auto; }

    /* ── 右侧 pane 边框 ──────────────────────────────────────────────────────── */
    #pane-right { border-left: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>Claude Code</h1>

  <div class="tab-bar">
    <button class="tab active" id="tab-chat">聊天</button>
    <button class="tab" id="tab-files">文件</button>
  </div>

  <div class="font-ctrls">
    <button class="hbtn" id="font-dec" title="缩小字体">A-</button>
    <span class="size-label" id="font-size-label">15px</span>
    <button class="hbtn" id="font-inc" title="放大字体">A+</button>
  </div>

  <button class="hbtn" id="enter-mode-btn" title="切换 Enter 键行为"></button>

  <div class="header-spacer"></div>
  <div id="status-dot"></div>
  <span id="status-text">连接中...</span>
  <button class="hbtn danger" id="logout-btn">退出</button>
</div>

<!-- ── Chat View ─────────────────────────────────────────────────────────────── -->
<div id="view-chat">
  <div id="chat-term-wrap">
    <div id="terminal-wrap"></div>
    <button id="scroll-bottom-btn" title="滚到最新消息">↓</button>
  </div>

  <div id="toolbar">
    <button class="tbtn" data-key="up"        title="方向键上">↑</button>
    <button class="tbtn" data-key="down"      title="方向键下">↓</button>
    <button class="tbtn" data-key="enter"     title="回车确认">↵ 确认</button>
    <button class="tbtn" data-key="tab"       title="Tab 补全">Tab</button>
    <button class="tbtn yellow" data-key="escape" title="Esc">Esc</button>
    <button class="tbtn" data-text="/clear"    title="清除上下文">/clear</button>
    <button class="tbtn" data-text="/usage"   title="查看用量">/usage</button>
    <button class="tbtn" data-text="1"        title="发送 1">1</button>
    <button class="tbtn" data-text="2"        title="发送 2">2</button>
    <button class="tbtn" data-text="3"        title="发送 3">3</button>
    <button class="tbtn red" data-key="ctrl_c" title="中断 Ctrl+C">⊘ 中断</button>
    <button class="tbtn red" data-key="ctrl_d" title="退出 Ctrl+D">⏏ 退出</button>
    <button class="tbtn" id="clear-display-btn" title="清除页面显示（不影响 Claude 上下文，减少手机卡顿）">清显示</button>
  </div>

  <div id="input-area">
    <textarea id="input" rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
</div>

<!-- ── File View ──────────────────────────────────────────────────────────────── -->
<div id="view-files">
  <div id="file-split">

    <!-- Left: file tree -->
    <div id="file-tree-panel">
      <div class="panel-title">文件浏览<div style="display:flex;gap:4px"><button id="tree-collapse-btn" class="hbtn" title="折叠文件树（双击分隔条也可切换）">◀</button><button id="refresh-files-btn" class="hbtn" title="刷新">⟳</button></div></div>
      <div id="file-path-bar">/</div>
      <div id="file-list"></div>
    </div>

    <!-- Drag handle: tree ↔ content -->

<script>
// ── xterm.js Terminal ─────────────────────────────────────────────────────────

const FONT_SIZES = [12, 13, 14, 15, 16, 17, 18, 20];
let fontIdx = FONT_SIZES.indexOf(parseInt(localStorage.getItem('cc_font_size') || '15'));
if (fontIdx < 0) fontIdx = 3;

// 手机端禁止 xterm 内部 textarea 抢焦点（否则触摸终端滚动时会弹出输入法）
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const term = new Terminal({
  fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace",
  fontSize: FONT_SIZES[fontIdx],
  disableStdin: isMobile,
  theme: {
    background:      '#1e2030',
    foreground:      '#c0caf5',
    cursor:          '#c0caf5',
    cursorAccent:    '#1e2030',
    selectionBackground: '#414868',
    black:           '#1a1b26',
    red:             '#ff5555',
    green:           '#50fa7b',
    yellow:          '#f1fa8c',
    blue:            '#6272a4',
    magenta:         '#ff79c6',
    cyan:            '#8be9fd',
    white:           '#f8f8f2',
    brightBlack:     '#787c99',
    brightRed:       '#ff6e6e',
    brightGreen:     '#69ff94',
    brightYellow:    '#ffffa5',
    brightBlue:      '#d6acff',
    brightMagenta:   '#ff92df',
    brightCyan:      '#a4ffff',
    brightWhite:     '#ffffff',
  },
  cursorBlink: true,
  scrollback: 5000,
  allowTransparency: false,
  convertEol: false,
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal-wrap'));
fitAddon.fit();

// 手机端：xterm 内部 textarea 触摸时会获焦并弹出输入法（disableStdin 仅禁止
// 键盘输入处理，不阻止 focus）。在 open() 后立即拦截其 focus 事件并 blur，
// 同时设 inputmode="none" 告知浏览器此处不需要软键盘。
if (isMobile && term.textarea) {
  term.textarea.setAttribute('inputmode', 'none');
  term.textarea.addEventListener('focus', () => term.textarea.blur());
}

// _atBottom：由 term.onScroll 持续维护，记录用户是否处于底部。
// _inFit：fitAddon.fit() 执行期间置 true，屏蔽 xterm 内部 resize 触发的
//   杂散 onScroll 事件——这些事件携带过渡期错误的 viewportY（如 0），
//   会把 _atBottom 错误地置为 false，导致后续 scrollToBottom 被跳过。
let _atBottom = true;
let _inFit   = false;

// safeFit：resize 后若之前在底部则恢复到底部。
// 关键：先快照 shouldScroll，再调 fit（fit 内部会触发 onScroll 污染 _atBottom）。
// scrollToBottom 立即 + RAF 双保险：立即调用修正 canvas，RAF 防止被后续渲染覆盖。
function safeFit() {
  const shouldScroll = _atBottom;   // 在 fit 修改 _atBottom 之前先快照
  _inFit = true;
  fitAddon.fit();
  _inFit = false;
  if (shouldScroll) {
    term.scrollToBottom();
    requestAnimationFrame(() => term.scrollToBottom());
  }
}

// ── 终端 Ctrl+C / Ctrl+V 处理 ─────────────────────────────────────────────────
term.attachCustomKeyEventHandler(evt => {
  if (evt.type !== 'keydown') return true;

  if (evt.ctrlKey && evt.key === 'c') {
    if (term.hasSelection()) {
      navigator.clipboard.writeText(term.getSelection()).catch(() => {});
      return false;
    }
    return true;
  }

  if (evt.ctrlKey && evt.key === 'v') {
    navigator.clipboard.readText().then(text => {
      if (text && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'input', data: text }));
      }
    }).catch(() => {});
    return false;
  }

  if (evt.ctrlKey && (evt.key === '1' || evt.key === '2' || evt.key === '3')) {
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'input', data: evt.key }));
      ws.send(JSON.stringify({ type: 'key',  key: 'enter' }));
    }
    return false;
  }

  return true;
});

// ── Font size control ─────────────────────────────────────────────────────────

function applyFontSize() {
  const sz = FONT_SIZES[fontIdx];
  term.options.fontSize = sz;
  document.getElementById('font-size-label').textContent = sz + 'px';
  localStorage.setItem('cc_font_size', sz);
  document.documentElement.style.setProperty('--file-font-size', sz + 'px');
  setTimeout(() => { sendResize(); }, 50);
}

document.getElementById('font-inc').addEventListener('click', () => {
  if (fontIdx < FONT_SIZES.length - 1) { fontIdx++; applyFontSize(); }
});
document.getElementById('font-dec').addEventListener('click', () => {
  if (fontIdx > 0) { fontIdx--; applyFontSize(); }
});

document.getElementById('font-size-label').textContent = FONT_SIZES[fontIdx] + 'px';
document.documentElement.style.setProperty('--file-font-size', FONT_SIZES[fontIdx] + 'px');

// ── Enter 模式 ────────────────────────────────────────────────────────────────
let enterSend = localStorage.getItem('cc_enter_send') !== 'false';

function applyEnterMode() {
  const btn   = document.getElementById('enter-mode-btn');
  const input = document.getElementById('input');
  if (enterSend) {
    btn.textContent      = '↵ 发送';
    input.placeholder    = '输入消息…（Enter 发送，Shift+Enter 换行）';
  } else {
    btn.textContent      = '↵ 换行';
    input.placeholder    = '输入消息…（Enter 换行，Ctrl+Enter 发送）';
  }
  localStorage.setItem('cc_enter_send', enterSend);
}

document.getElementById('enter-mode-btn').addEventListener('click', () => {
  enterSend = !enterSend;
  applyEnterMode();
});

applyEnterMode();

// ── Tab / View switching ──────────────────────────────────────────────────────

const viewChat  = document.getElementById('view-chat');
const viewFiles = document.getElementById('view-files');
const tabChat   = document.getElementById('tab-chat');
const tabFiles  = document.getElementById('tab-files');

function switchView(view) {
  if (view === 'chat') {
    viewChat.style.display  = 'flex';
    viewFiles.style.display = 'none';
    tabChat.classList.add('active');
    tabFiles.classList.remove('active');
    setTimeout(() => { sendResize(); }, 50);
  } else {
    viewChat.style.display  = 'none';
    viewFiles.style.display = 'flex';
    tabChat.classList.remove('active');
    tabFiles.classList.add('active');
    if (!fileLoaded) { loadFiles(); fileLoaded = true; }
  }
}

tabChat.addEventListener('click',  () => switchView('chat'));
tabFiles.addEventListener('click', () => switchView('files'));

// ── App state ─────────────────────────────────────────────────────────────────

const token = localStorage.getItem('cc_token');
if (!token) { location.href = '/'; }

let ws             = null;
let reconnectDelay = 1000;
let connected      = false;
let fileLoaded     = false;
let currentFilePath = null;  // last opened file path, for insert-path

const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

// ── WebSocket ─────────────────────────────────────────────────────────────────

function sendResize() {
  safeFit();
  const { cols, rows } = term;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'resize', cols, rows }));
  }
}

function setStatus(state, text) {
  statusDot.className  = (state === 'ok' || state === 'error') ? state : '';
  statusText.textContent = text;
}

(function boot() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'auth', token }));
    reconnectDelay = 1000;
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'auth_ok') {
      connected = true;
      setStatus('ok', `已连接  ${msg.username}`);
      sendBtn.disabled = false;
      sendResize();
      // 断线重连后恢复所有 pane 的文件监听
      [paneLeft, paneRight].forEach(pane => {
        if (pane.edit.active && pane.edit.filePath) {
          ws.send(JSON.stringify({ type: 'watch_file', path: pane.edit.filePath }));
        }
      });
    }
    else if (msg.type === 'output') {
      term.write(msg.data);
    }
    else if (msg.type === 'exit') {
      connected = false;
      setStatus('error', `进程已退出（code ${msg.code}）`);
      term.write('\r\n\x1b[33m[Claude 进程已退出，刷新页面重启]\x1b[0m\r\n');
    }
    else if (msg.type === 'error') {
      term.write(`\r\n\x1b[31m[错误：${msg.message}]\x1b[0m\r\n`);
      if (msg.message.includes('令牌')) {
        localStorage.removeItem('cc_token');
        setTimeout(() => location.href = '/', 1500);
      }
    }
    else if (msg.type === 'file_changed') {
      [paneLeft, paneRight].forEach(pane => {
        if (pane.edit.active && msg.path === pane.edit.filePath) {
          showBanner(pane, 'Claude 已修改此文件，建议保存后重新加载');
        }
      });
    }
  };

  ws.onclose = () => {
    connected = false;
    sendBtn.disabled = true;
    setStatus('error', '连接断开，重连中…');
    setTimeout(boot, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };

  ws.onerror = () => ws.close();
})();

// ── Send input ────────────────────────────────────────────────────────────────

const KEY_MAP = {
  up:         '\x1b[A',
  down:       '\x1b[B',
  left:       '\x1b[D',
  right:      '\x1b[C',
  enter:      '\r',
  ctrl_c:     '\x03',
  ctrl_d:     '\x04',
  ctrl_z:     '\x1a',
  ctrl_l:     '\x0c',
  backspace:  '\x7f',
  escape:     '\x1b',
  tab:        '\t',
  page_up:    '\x1b[5~',
  page_down:  '\x1b[6~',
};

function sendText() {
  const text = inputEl.value;
  if (!text.trim() && text !== '') return;
  if (!connected) return;

  if (text.trim()) {
    ws.send(JSON.stringify({ type: 'input', data: text }));
    ws.send(JSON.stringify({ type: 'key',  key: 'enter' }));
  } else {
    ws.send(JSON.stringify({ type: 'key', key: 'enter' }));
  }

  inputEl.value = '';
  autoResize();
}

document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('[data-key],[data-text]');
  if (!btn || !connected) return;
  if (btn.dataset.text !== undefined) {
    if (btn.dataset.text) ws.send(JSON.stringify({ type: 'input', data: btn.dataset.text }));
    ws.send(JSON.stringify({ type: 'key', key: 'enter' }));
  } else {
    ws.send(JSON.stringify({ type: 'key', key: btn.dataset.key }));
  }
  // 不再调用 inputEl.focus()：手机端会弹出输入法并触发布局 resize，
  // 导致终端滚回顶部；工具栏按钮（↑↓↵）主要用于导航操作，不需要键盘。
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const shouldSend = enterSend ? !e.shiftKey : e.ctrlKey;
    if (shouldSend) {
      e.preventDefault();
      sendText();
    }
  }
});
inputEl.addEventListener('input', autoResize);
// 移动端：焦点在 touchstart 阶段就已转移，mousedown.preventDefault() 太晚。
// 改为在 touchstart 直接发送并阻止默认行为（同时阻止后续 click，避免重复触发）。
sendBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  sendText();
}, { passive: false });
// 桌面端：mousedown 阻止失焦，click 触发发送（touchstart 不会在桌面触发）。
sendBtn.addEventListener('mousedown', e => e.preventDefault());
sendBtn.addEventListener('click', sendText);

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('cc_token');
  location.href = '/';
});

// 用 ResizeObserver 替代 window.resize：
// window.resize 触发时 CSS 布局可能尚未完成，fitAddon.fit() 读到旧尺寸无效；
// ResizeObserver 在 CSS 布局完成后触发，能保证读到正确的新尺寸。
// 键盘弹出/收起、字体调整、窗口缩放均可精确响应。
let _wsResizeTimer;
new ResizeObserver(() => {
  safeFit();
  clearTimeout(_wsResizeTimer);
  _wsResizeTimer = setTimeout(() => {
    const { cols, rows } = term;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'resize', cols, rows }));
    }
  }, 300);
}).observe(document.getElementById('chat-term-wrap'));

// ── 滚动到底部按钮 ────────────────────────────────────────────────────────────

const scrollBottomBtn = document.getElementById('scroll-bottom-btn');

term.onScroll(viewportY => {
  if (_inFit) return;   // 忽略 fitAddon.fit() 期间的杂散事件
  const buf = term.buffer.active;
  _atBottom = viewportY >= buf.length - term.rows;
  scrollBottomBtn.classList.toggle('visible', !_atBottom);
});

scrollBottomBtn.addEventListener('click', () => {
  term.scrollToBottom();
});

// ── 清显示按钮（只清页面显示，不影响 Claude 上下文）────────────────────────────

document.getElementById('clear-display-btn').addEventListener('click', () => {
  term.clear();
});

// ── Resize handle drag (tree ↔ content) ──────────────────────────────────────

const resizeHandle  = document.getElementById('resize-handle');
const fileTreePanel = document.getElementById('file-tree-panel');
const fileSplit     = document.getElementById('file-split');
let isResizing   = false;
let resizeStartX = 0;
let resizeStartW = 0;
let savedTreeWidth = parseInt(localStorage.getItem('cc_tree_width') || '260');
setTreeWidth(savedTreeWidth);

function setTreeWidth(w) {
  fileTreePanel.style.width = w + 'px';
  if (w === 0) {
    fileSplit.classList.add('tree-collapsed');
  } else {
    fileSplit.classList.remove('tree-collapsed');
    savedTreeWidth = w;
    localStorage.setItem('cc_tree_width', w);
  }
}

function toggleTree() {
  if (fileSplit.classList.contains('tree-collapsed')) {
    setTreeWidth(savedTreeWidth || 260);
  } else {
    setTreeWidth(0);
  }
}

function startResize(clientX) {
  isResizing   = true;
  resizeStartX = clientX;
  resizeStartW = fileTreePanel.offsetWidth;
  resizeHandle.classList.add('dragging');
  document.body.style.cursor     = 'col-resize';
  document.body.style.userSelect = 'none';
}

function doResize(clientX) {
  if (!isResizing) return;
  const raw  = resizeStartW + clientX - resizeStartX;
  const newW = Math.min(Math.max(0, raw), window.innerWidth * 0.75);
  setTreeWidth(newW < 20 ? 0 : newW);
}

function stopResize() {
  if (!isResizing) return;
  isResizing = false;
  resizeHandle.classList.remove('dragging');
  document.body.style.cursor     = '';
  document.body.style.userSelect = '';
}

resizeHandle.addEventListener('mousedown', e => { startResize(e.clientX); e.preventDefault(); });
document.addEventListener('mousemove', e => doResize(e.clientX));
document.addEventListener('mouseup',   stopResize);
resizeHandle.addEventListener('dblclick', toggleTree);

resizeHandle.addEventListener('touchstart', e => {
  startResize(e.touches[0].clientX);
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (isResizing) { doResize(e.touches[0].clientX); e.preventDefault(); }
}, { passive: false });
document.addEventListener('touchend', stopResize);

document.getElementById('tree-collapse-btn').addEventListener('click', toggleTree);

// ── Pane divider drag (left pane ↔ right pane) ───────────────────────────────

const fileContentArea = document.getElementById('file-content-area');
const paneDivider     = document.getElementById('pane-divider');
let isPaneDivResizing  = false;
let paneDivStartX      = 0;
let paneDivRightStartW = 0;

paneDivider.addEventListener('mousedown', e => {
  isPaneDivResizing  = true;
  paneDivStartX      = e.clientX;
  paneDivRightStartW = document.getElementById('pane-right').offsetWidth;
  paneDivider.classList.add('dragging');
  document.body.style.cursor     = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isPaneDivResizing) return;
  const delta = paneDivStartX - e.clientX;  // drag left = right pane grows
  const maxW  = fileContentArea.offsetWidth - 200;
  const newW  = Math.max(150, Math.min(paneDivRightStartW + delta, maxW));
  const rPane = document.getElementById('pane-right');
  rPane.style.flex  = 'none';
  rPane.style.width = newW + 'px';
});

document.addEventListener('mouseup', () => {
  if (!isPaneDivResizing) return;
  isPaneDivResizing = false;
  paneDivider.classList.remove('dragging');
  document.body.style.cursor     = '';
  document.body.style.userSelect = '';
});

// ── Pane state factory ────────────────────────────────────────────────────────

function makePaneState(paneEl) {
  return {
    el:              paneEl,
    header:          paneEl.querySelector('.pane-header'),
    viewHd:          paneEl.querySelector('.pane-view-hd'),
    editHd:          paneEl.querySelector('.pane-edit-hd'),
    bannerEl:        paneEl.querySelector('.pane-banner'),
    bannerMsgEl:     paneEl.querySelector('.pane-banner-msg'),
    body:            paneEl.querySelector('.pane-body'),
    titleEl:         paneEl.querySelector('.pane-title'),
    badgeEl:         paneEl.querySelector('.pane-badge'),
    editTitleEl:     paneEl.querySelector('.pane-edit-title'),
    saveStatusEl:    paneEl.querySelector('.pane-save-status'),
    editBtn:         paneEl.querySelector('.pane-edit-btn'),
    insertBtn:       paneEl.querySelector('.pane-insert-btn'),
    saveBtn:         paneEl.querySelector('.pane-save-btn'),
    cancelBtn:       paneEl.querySelector('.pane-cancel-btn'),
    bannerReloadBtn: paneEl.querySelector('.pane-banner-reload'),
    bannerForceBtn:  paneEl.querySelector('.pane-banner-force'),
    closeBtn:        paneEl.querySelector('.pane-close-btn'),  // null for left pane

    // per-pane file state
    filePath:  null,
    fileName:  null,
    pdfObjUrl: null,

    // per-pane edit state
    edit: {
      active:           false,
      filePath:         null,
      fileName:         null,
      lastSavedContent: null,
      serverMtime:      null,
      autoSaveTimer:    null,
      saveInProgress:   false,
      treeWasVisible:   true,
    },
  };
}

const paneLeft  = makePaneState(document.getElementById('pane-left'));
const paneRight = makePaneState(document.getElementById('pane-right'));

// ── Per-pane helpers ──────────────────────────────────────────────────────────

function showBanner(pane, msg) {
  pane.bannerMsgEl.textContent = '⚠ ' + msg;
  pane.bannerEl.classList.add('visible');
}
function hideBanner(pane) {
  pane.bannerEl.classList.remove('visible');
}

function setSaveStatus(pane, cls, text) {
  pane.saveStatusEl.className   = 'save-status' + (cls ? ' ' + cls : '');
  pane.saveStatusEl.textContent = text;
}

function fmtTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

// ── Open / close right pane ───────────────────────────────────────────────────

function openRightPane() {
  const rPane = document.getElementById('pane-right');
  rPane.style.display = 'flex';
  rPane.style.flex    = 'none';
  rPane.style.width   = '50%';
  paneDivider.style.display = '';
}

function closeRightPane() {
  if (paneRight.edit.active) exitEditMode(paneRight);
  if (paneRight.pdfObjUrl) { URL.revokeObjectURL(paneRight.pdfObjUrl); paneRight.pdfObjUrl = null; }
  paneRight.el.style.display = 'none';
  paneRight.el.style.flex    = '1';
  paneDivider.style.display  = 'none';
  paneRight.filePath = null;
  paneRight.fileName = null;
  paneRight.header.style.display = 'none';
  paneRight.body.innerHTML       = '';
}

// ── Setup pane button event listeners ────────────────────────────────────────

function setupPaneButtons(pane) {
  pane.saveBtn.addEventListener('click', () => saveFile(pane));
  pane.cancelBtn.addEventListener('click', () => exitEditMode(pane));

  pane.bannerReloadBtn.addEventListener('click', () => {
    if (pane.edit.filePath) openFile(pane, pane.edit.filePath, pane.edit.fileName);
    else if (pane.filePath) openFile(pane, pane.filePath, pane.fileName);
  });
  pane.bannerForceBtn.addEventListener('click', () => {
    hideBanner(pane);
    const ta = pane.body.querySelector('.edit-textarea');
    if (ta) saveFile(pane, ta.value);
  });

  if (pane.insertBtn) {
    pane.insertBtn.addEventListener('click', () => {
      if (!pane.filePath) return;
      switchView('chat');
      inputEl.value += (inputEl.value ? ' ' : '') + pane.filePath;
      autoResize();
      inputEl.focus();
    });
  }

  if (pane.closeBtn) {
    pane.closeBtn.addEventListener('click', closeRightPane);
  }
}

setupPaneButtons(paneLeft);
setupPaneButtons(paneRight);

// ── File browser ──────────────────────────────────────────────────────────────

const pathBar         = document.getElementById('file-path-bar');
const fileListEl      = document.getElementById('file-list');
const refreshFilesBtn = document.getElementById('refresh-files-btn');
let currentDir = null;

refreshFilesBtn.addEventListener('click', () => loadFiles(currentDir));

async function loadFiles(dir) {
  fileListEl.innerHTML = '<div class="file-entry"><div class="icon">…</div><div>加载中</div></div>';
  try {
    const url = dir ? `/api/files?path=${encodeURIComponent(dir)}` : '/api/files';
    const res  = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) {
      fileListEl.innerHTML = `<div class="file-entry" style="color:var(--danger)">${data.error}</div>`;
      return;
    }

    pathBar.textContent = data.path;
    currentDir = data.path;
    fileListEl.innerHTML = '';

    if (data.parent && data.parent !== data.path) {
      fileListEl.appendChild(makeEntry('↩ 上级目录', 'dir', data.parent));
    }
    data.entries.forEach(entry => {
      fileListEl.appendChild(makeEntry(entry.name, entry.type, entry.path));
    });
  } catch {
    fileListEl.innerHTML = '<div class="file-entry" style="color:var(--danger)">加载失败</div>';
  }
}

function makeEntry(name, type, filePath) {
  const div = document.createElement('div');
  div.className = `file-entry ${type}`;
  div.innerHTML = `<div class="icon">${type === 'dir' ? '📁' : getFileIcon(name)}</div>
                   <div class="name">${esc(name)}</div>`;

  div.addEventListener('click', () => {
    if (type === 'dir') {
      loadFiles(filePath);
    } else {
      fileListEl.querySelectorAll('.file-entry').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      openFile(paneLeft, filePath, name);
    }
  });

  // Drag-and-drop: file entries are draggable
  if (type === 'file') {
    div.draggable = true;
    div.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ filePath, name }));
      e.dataTransfer.effectAllowed = 'copy';
    });
  }

  return div;
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    md: '📝', txt: '📄', js: '🟨', ts: '🔷', py: '🐍',
    sh: '⚙️', json: '{ }', yaml: '📋', yml: '📋',
    css: '🎨', html: '🌐', htm: '🌐', go: '🐹',
    rs: '🦀', java: '☕', c: '⚙️', cpp: '⚙️', h: '⚙️',
    docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', csv: '📊', pdf: '📕',
  };
  return icons[ext] || '📄';
}

function detectFileType(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['md','markdown','mdx'].includes(ext)) return 'markdown';
  if (ext === 'docx') return 'docx';
  if (ext === 'doc')  return 'doc';
  if (['xlsx','xls','csv'].includes(ext)) return 'xlsx';
  if (ext === 'pdf')  return 'pdf';
  const codeExts = ['js','ts','jsx','tsx','py','sh','bash','json','yaml','yml',
                    'css','html','htm','go','rs','java','c','cpp','h','hpp',
                    'toml','ini','env','sql','xml','dockerfile','gitignore'];
  if (codeExts.includes(ext)) return 'code';
  return 'text';
}

function isEditableType(t) { return ['text','code','markdown'].includes(t); }

const langMap = {
  c:'c', h:'c', cpp:'cpp', cc:'cpp', cxx:'cpp', hpp:'cpp',
  py:'python', pyw:'python',
  js:'javascript', jsx:'javascript', mjs:'javascript',
  ts:'typescript', tsx:'typescript',
  go:'go', rs:'rust', java:'java', kt:'kotlin', swift:'swift',
  sh:'bash', bash:'bash', zsh:'bash',
  json:'json', yaml:'yaml', yml:'yaml', toml:'ini',
  css:'css', scss:'scss', less:'less',
  html:'html', htm:'html', xml:'xml',
  sql:'sql', md:'markdown', lua:'lua', rb:'ruby', php:'php',
};

function renderCodeView(pane, name, content) {
  const ext  = name.split('.').pop().toLowerCase();
  const lang = langMap[ext];
  const pre  = document.createElement('pre');
  pre.className = 'code-view';
  const code = document.createElement('code');
  code.textContent = content;
  if (lang && window.hljs && hljs.getLanguage(lang)) {
    code.className = `language-${lang}`;
    pre.appendChild(code);
    hljs.highlightElement(code);
  } else {
    pre.appendChild(code);
  }
  pane.body.innerHTML = '';
  pane.body.appendChild(pre);
}

async function openFile(pane, filePath, name) {
  // If this pane is in edit mode, silently exit
  if (pane.edit.active) {
    clearInterval(pane.edit.autoSaveTimer);
    pane.edit.autoSaveTimer = null;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'unwatch_file', path: pane.edit.filePath }));
    }
    pane.edit.active   = false;
    pane.edit.filePath = null;
    pane.edit.fileName = null;
    pane.viewHd.style.display = 'flex';
    pane.editHd.style.display = 'none';
    // Restore tree if we hid it for this pane
    if (pane === paneLeft && pane.edit.treeWasVisible) {
      fileTreePanel.style.display = 'flex';
      resizeHandle.style.display  = '';
    }
  }

  // Revoke old PDF Object URL
  if (pane.pdfObjUrl) { URL.revokeObjectURL(pane.pdfObjUrl); pane.pdfObjUrl = null; }

  pane.header.style.display    = 'flex';
  pane.viewHd.style.display    = 'flex';
  pane.editHd.style.display    = 'none';
  if (pane.editBtn) pane.editBtn.style.display = 'none';
  pane.titleEl.textContent     = filePath;
  if (pane.insertBtn) pane.insertBtn.style.display = 'inline-block';
  pane.filePath = filePath;
  pane.fileName = name;
  currentFilePath = filePath;
  hideBanner(pane);

  pane.badgeEl.textContent = '';
  pane.body.innerHTML = '<div class="file-placeholder"><div class="ph-icon">⏳</div><div class="ph-text">加载中…</div></div>';

  try {
    const res  = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await res.json();
    if (!res.ok) {
      pane.body.innerHTML = `<div class="file-placeholder"><div class="ph-icon">❌</div><div class="ph-text">${esc(data.error)}</div></div>`;
      return;
    }

    const serverType = data.type;

    if (serverType === 'docx') {
      pane.badgeEl.textContent = 'DOCX';
      pane.body.innerHTML = `<div class="docx-view">${data.html}</div>`;

    } else if (serverType === 'xlsx') {
      pane.badgeEl.textContent = name.split('.').pop().toUpperCase();
      pane.body.innerHTML = `<div class="table-view">${data.html}</div>`;

    } else if (serverType === 'pdf') {
      pane.badgeEl.textContent = 'PDF';
      const pdfRes = await fetch(data.rawUrl, { headers: { Authorization: 'Bearer ' + token } });
      const blob   = await pdfRes.blob();
      pane.pdfObjUrl = URL.createObjectURL(blob);
      pane.body.innerHTML = `<embed src="${pane.pdfObjUrl}" type="application/pdf" width="100%" style="height:100%;min-height:600px">`;

    } else if (serverType === 'unsupported') {
      pane.badgeEl.textContent = name.split('.').pop().toUpperCase();
      pane.body.innerHTML = `<div class="unsupported-view"><div style="font-size:2rem">🚫</div><div>${esc(data.message)}</div></div>`;

    } else {
      // text type
      const localType = detectFileType(name);
      pane.badgeEl.textContent = localType === 'markdown' ? 'Markdown' : localType === 'code' ? name.split('.').pop().toUpperCase() : 'TEXT';

      if (localType === 'markdown') {
        pane.body.innerHTML = `<div class="md-view">${renderMarkdown(data.content)}</div>`;
      } else {
        renderCodeView(pane, name, data.content);
      }

      if (isEditableType(localType)) {
        if (pane.editBtn) {
          pane.editBtn.style.display = 'inline-block';
          pane.editBtn.onclick = () => enterEditMode(pane, filePath, name, data.content, data.mtime);
        }
      }
    }
  } catch (e) {
    pane.body.innerHTML = `<div class="file-placeholder"><div class="ph-icon">❌</div><div class="ph-text">读取失败: ${esc(e.message)}</div></div>`;
  }
}

// ── Edit mode ─────────────────────────────────────────────────────────────────

function enterEditMode(pane, filePath, name, content, mtime) {
  pane.edit.active           = true;
  pane.edit.filePath         = filePath;
  pane.edit.fileName         = name;
  pane.edit.lastSavedContent = content;
  pane.edit.serverMtime      = mtime;
  pane.edit.saveInProgress   = false;

  pane.header.style.display    = 'flex';
  pane.viewHd.style.display    = 'none';
  pane.editHd.style.display    = 'flex';
  pane.editTitleEl.textContent = name;
  setSaveStatus(pane, '', '');
  hideBanner(pane);

  const ta = document.createElement('textarea');
  ta.className = 'edit-textarea';
  ta.value     = content;
  pane.body.innerHTML = '';
  pane.body.appendChild(ta);

  // Fix: restore scroll to top, don't auto-scroll to bottom
  requestAnimationFrame(() => {
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
    ta.focus();
  });

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'watch_file', path: filePath }));
  }
  pane.edit.autoSaveTimer = setInterval(() => autoSave(pane), 30000);

  // Hide file tree when left pane enters edit mode (only if right pane not open)
  if (pane === paneLeft && paneRight.el.style.display === 'none') {
    pane.edit.treeWasVisible    = fileTreePanel.style.display !== 'none';
    fileTreePanel.style.display = 'none';
    resizeHandle.style.display  = 'none';
  } else {
    pane.edit.treeWasVisible = true;
  }
}

function exitEditMode(pane) {
  if (!pane.edit.active) return;
  clearInterval(pane.edit.autoSaveTimer);
  pane.edit.autoSaveTimer = null;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'unwatch_file', path: pane.edit.filePath }));
  }
  const fp = pane.edit.filePath, fn = pane.edit.fileName;
  pane.edit.active   = false;
  pane.edit.filePath = null;
  pane.edit.fileName = null;
  pane.viewHd.style.display = 'flex';
  pane.editHd.style.display = 'none';
  hideBanner(pane);

  // Restore file tree if we hid it
  if (pane === paneLeft && pane.edit.treeWasVisible) {
    fileTreePanel.style.display = 'flex';
    resizeHandle.style.display  = '';
  }

  openFile(pane, fp, fn);
}

async function saveFile(pane, forceContent) {
  if (pane.edit.saveInProgress) return;
  pane.edit.saveInProgress = true;
  const ta         = pane.body.querySelector('.edit-textarea');
  const newContent = forceContent !== undefined ? forceContent : (ta ? ta.value : pane.edit.lastSavedContent);

  setSaveStatus(pane, 'saving', '保存中…');
  try {
    let body;
    if (forceContent !== undefined) {
      body = { path: pane.edit.filePath, content: forceContent };
    } else {
      const patch = Diff.createPatch(pane.edit.fileName, pane.edit.lastSavedContent, newContent, '', '');
      if (patch.indexOf('@@') === -1) {
        setSaveStatus(pane, 'saved', '已保存 ' + fmtTime());
        pane.edit.saveInProgress = false;
        return;
      }
      body = { path: pane.edit.filePath, patch, mtime: pane.edit.serverMtime };
    }
    const res  = await fetch('/api/file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.status === 409 && data.conflict) {
      handleConflict(pane, data.currentContent, data.currentMtime, newContent);
    } else if (res.ok) {
      pane.edit.serverMtime      = data.mtime;
      pane.edit.lastSavedContent = newContent;
      setSaveStatus(pane, 'saved', '已保存 ' + fmtTime());
    } else {
      setSaveStatus(pane, 'error', '保存失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    setSaveStatus(pane, 'error', '保存失败：' + e.message);
  } finally {
    pane.edit.saveInProgress = false;
  }
}

function autoSave(pane) {
  if (!pane.edit.active) return;
  const ta = pane.body.querySelector('.edit-textarea');
  if (!ta || ta.value === pane.edit.lastSavedContent) return;
  saveFile(pane);
}

function handleConflict(pane, serverContent, serverMtime, localContent) {
  setSaveStatus(pane, 'error', '保存冲突');
  showBanner(pane, 'Claude 已修改此文件，与您的编辑产生冲突');
  pane.bannerReloadBtn.onclick = () => {
    const ta = pane.body.querySelector('.edit-textarea');
    if (ta) ta.value = serverContent;
    pane.edit.lastSavedContent = serverContent;
    pane.edit.serverMtime      = serverMtime;
    hideBanner(pane);
    setSaveStatus(pane, '', '已重新加载');
  };
  pane.bannerForceBtn.onclick = () => {
    hideBanner(pane);
    saveFile(pane, localContent);
  };
}

// ── Drag and drop onto content area ──────────────────────────────────────────

const dropHint = document.createElement('div');
dropHint.className = 'drop-hint';
fileContentArea.appendChild(dropHint);

fileContentArea.addEventListener('dragover', e => {
  // Only accept drags from file entries (text/plain with our JSON)
  if (!e.dataTransfer.types.includes('text/plain')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  const rect    = fileContentArea.getBoundingClientRect();
  const isRight = e.clientX > rect.left + rect.width / 2;
  dropHint.className = 'drop-hint ' + (isRight ? 'right' : 'left');
});

fileContentArea.addEventListener('dragleave', e => {
  if (!fileContentArea.contains(e.relatedTarget)) {
    dropHint.className = 'drop-hint';
  }
});

fileContentArea.addEventListener('drop', e => {
  e.preventDefault();
  dropHint.className = 'drop-hint';
  try {
    const { filePath, name } = JSON.parse(e.dataTransfer.getData('text/plain'));
    const rect    = fileContentArea.getBoundingClientRect();
    const isRight = e.clientX > rect.left + rect.width / 2;
    if (isRight) {
      if (paneRight.el.style.display === 'none') openRightPane();
      openFile(paneRight, filePath, name);
    } else {
      openFile(paneLeft, filePath, name);
    }
  } catch {}
});

// ── Markdown renderer ─────────────────────────────────────────────────────────

function renderMarkdown(raw) {
  const codeBlocks = [];

  let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang || '', code });
    return `\n\x00CODE${idx}\x00\n`;
  });

  text = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const inlineCodes = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    const idx = inlineCodes.length;
    inlineCodes.push(code);
    return `\x01IC${idx}\x01`;
  });

  text = text.replace(/^#### (.+)$/gm,  '<h4>$1</h4>');
  text = text.replace(/^### (.+)$/gm,   '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm,    '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm,     '<h1>$1</h1>');

  text = text.replace(/^---+$/gm, '<hr>');
  text = text.replace(/^\*\*\*+$/gm, '<hr>');

  text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  text = text.replace(/((?:^\|.+\|\n?)+)/gm, tableBlock => {
    const rows = tableBlock.trim().split('\n');
    if (rows.length < 2) return tableBlock;
    const parsedRows = rows.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const isSep = row => row.every(c => /^[-: ]+$/.test(c));
    if (!isSep(parsedRows[1])) return tableBlock;
    const headers = parsedRows[0].map(c => `<th>${c}</th>`).join('');
    const body = parsedRows.slice(2).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table>`;
  });

  text = text.replace(/((?:^[*\-] .+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[*\-] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  text = text.replace(/((?:^\d+\. .+\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  text = text.replace(/\x01IC(\d+)\x01/g, (_, idx) => `<code>${inlineCodes[idx]}</code>`);

  text = text.replace(/\x00CODE(\d+)\x00/g, (_, idx) => {
    const { lang, code } = codeBlocks[idx];
    const safeCode = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<pre><code class="lang-${lang}">${safeCode.trim()}</code></pre>`;
  });

  text = text.split(/\n\n+/).map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(h[1-6]|ul|ol|blockquote|pre|table|hr)/.test(block)) return block;
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  return text;
}

// ── Shared escape ──────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────

sendBtn.disabled = true;
setStatus('', '连接中…');
</script>
